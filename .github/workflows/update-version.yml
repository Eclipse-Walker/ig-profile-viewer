name: Update Version

on:
  push:
    branches:
      - main

jobs:
  update-version:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Default GITHUB_TOKEN pushes as github-actions[bot], which has no
          # role and can't satisfy a role-based ruleset bypass (e.g. "Repository
          # admin"). Using a PAT from an actual admin account makes the push
          # authenticate as that user instead, so the bypass applies.
          token: ${{ secrets.ADMIN_PAT }}

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Make script executable
        run: chmod +x buildscripts/update_version.sh

      - name: Update version
        id: update_version
        run: |
          new_version=$(./buildscripts/update_version.sh)
          echo "NEW_VERSION=$new_version" >> $GITHUB_ENV

      - name: Configure Git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

      - name: Commit and push changes
        run: |
          git add manifest.json
          git commit -m "${{ env.NEW_VERSION }}"
          git push
